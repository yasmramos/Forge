# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

  examples:
    # Fire-test for the examples/ projects (AGENT.md contract): if an
    # example stops building or running, Forge itself is broken.
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Package Forge CLI
      run: mvn -B -q package -DskipTests
    - name: Fire-test hello-world (build + run)
      working-directory: examples/hello-world
      run: |
        ../../bin/forge build
        ../../bin/forge run 2>/dev/null | grep -q "Hello from Forge"
    - name: Fire-test library (build + tests)
      working-directory: examples/library
      # The engine relays the JUnitRunner subprocess output through its own
      # logger, which prefixes every line with timestamp/level; match the
      # summary numbers regardless of that prefix.
      # Also assert the packaged jar carries the resource, proving section 22
      # (resources copied into the classes dir and packaged).
      run: |
        ../../bin/forge build 2>&1 | tee /tmp/lib.log | grep -Eq "FORGE-TESTS found=[0-9]+ passed=[1-9][0-9]* failed=0"
        jar tf target/forge-output/forge-main.jar | grep -q "library.properties"
        ../../bin/forge run 2>&1 | grep -q "Bundled resource greeting: hello"
    - name: Fire-test annotation processing (Lombok)
      # @Getter only compiles when Forge runs the processor discovered from the
      # compile classpath (AGENT.md section 23).
      working-directory: examples/annotation-processing
      run: |
        ../../bin/forge build 2>&1 | tee /tmp/apt.log | grep -Eq "FORGE-TESTS found=[0-9]+ passed=[1-9][0-9]* failed=0"
        ../../bin/forge run 2>&1 | grep -q "Hello Ada (36)"
    - name: Fire-test forge test runs tests without packaging
      # `forge test` shares the build's compile + TestExecutor path, so the
      # same library tests must pass and be reported here (AGENT.md section 10).
      working-directory: examples/library
      run: |
        ../../bin/forge test 2>&1 | tee /tmp/lib-test.log | grep -q "Tests passed."
        grep -Eq "FORGE-TESTS found=[0-9]+ passed=[1-9][0-9]* failed=0" /tmp/lib-test.log
    - name: Fire-test multi-module (modules + lock + build + run)
      working-directory: examples/multi-module
      run: |
        ../../bin/forge modules | grep -q "example.app"
        # The single root lock must cover the modules' external dependencies
        # (AGENT.md section 8bis), not just the empty root.
        ../../bin/forge lock refresh 2>&1 | grep -q "1 locked dependencies"
        # `forge update` is the explicit alias for `lock refresh` (section 7).
        ../../bin/forge update 2>&1 | grep -q "1 locked dependencies"
        grep -q "org.slf4j:slf4j-api" forge.lock
        ../../bin/forge build 2>&1 | grep -q "Multi-module build OK"
        # The app module consumes example.core by coordinate, so a correct
        # "2 + 3 = 5" proves inter-module resolution really worked.
        ../../bin/forge run example.app 2>/dev/null | grep -q "2 + 3 = 5"
    - name: Fire-test incremental build fails on broken source
      # Regression guard: `forge build incremental` used to exit 0 even when
      # compilation failed, so CI stayed green on broken code.
      run: |
        FORGE="$PWD/bin/forge"
        work="$(mktemp -d)"
        mkdir -p "$work/src/main/java/p"
        printf 'forge = "0.1"\n[project]\nname = "inc-fire"\nversion = "1.0.0"\ngroup = "p"\n[toolchain]\nlanguage = "11"\n' > "$work/forge.toml"
        printf 'package p;\npublic class A { public int f() { return 1; } }\n' > "$work/src/main/java/p/A.java"
        ( cd "$work" && "$FORGE" build incremental )
        printf 'package p;\npublic class A { public int f() { return "not an int"; } }\n' > "$work/src/main/java/p/A.java"
        if ( cd "$work" && "$FORGE" build incremental ); then
          echo "::error::incremental build reported success on broken source"
          exit 1
        fi
        echo "incremental build correctly failed on broken source"
    - name: Fire-test partial output regenerates missing classes
      # Regression guard: the warm-cache check used to accept the cache as long
      # as *any* .class existed, so deleting one class from a warm build left
      # an incomplete output that still reported success.
      run: |
        FORGE="$PWD/bin/forge"
        work="$(mktemp -d)"
        mkdir -p "$work/src/main/java/p"
        printf 'forge = "0.1"\n[project]\nname = "pc-fire"\nversion = "1.0.0"\n[toolchain]\nlanguage = "11"\n[source.main]\njava = ["src/main/java"]\n[build]\nincremental = true\ncache_enabled = true\n' > "$work/forge.toml"
        printf 'package p;\npublic class A { public int v() { return 1; } }\n' > "$work/src/main/java/p/A.java"
        printf 'package p;\npublic class B { public int v() { return new A().v() + 1; } }\n' > "$work/src/main/java/p/B.java"
        ( cd "$work" && "$FORGE" build >/dev/null 2>&1 )
        rm "$work/target/classes/p/B.class"
        ( cd "$work" && "$FORGE" build >/dev/null 2>&1 )
        if [ ! -f "$work/target/classes/p/B.class" ]; then
          echo "::error::build succeeded but the missing class was not regenerated"
          exit 1
        fi
        echo "missing class correctly regenerated from the warm cache"


