# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

  examples:
    # Fire-test for the examples/ projects (AGENT.md contract): if an
    # example stops building or running, Forge itself is broken.
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Package Forge CLI
      run: mvn -B -q package -DskipTests
    - name: Fire-test hello-world (build + run)
      working-directory: examples/hello-world
      run: |
        ../../bin/forge build
        ../../bin/forge run 2>/dev/null | grep -q "Hello from Forge"
    - name: Fire-test library (build + tests)
      working-directory: examples/library
      run: ../../bin/forge build 2>&1 | tee /tmp/lib.log | grep -q "FORGE-TESTS found=.*passed"

