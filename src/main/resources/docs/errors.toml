# Forge error catalog (AGENT.md section 10bis).
# Codes are stable public API: never reused, never renumbered.
# This file is validated against cli/error/ErrorCode.java by ErrorCatalogTest.

["FORGE-LCK-0001"]
what = "The content hash at the end of forge.lock does not match the file body."
why  = "The lockfile was edited by hand, truncated, or corrupted during transfer."
how  = "Delete forge.lock and run 'forge lock refresh' to regenerate it deterministically."
docs = "https://forge.dev/e/LCK-0001"

["FORGE-LCK-0002"]
what = "forge.lock uses a newer schema version than this Forge installation understands."
why  = "The lockfile was generated by a future Forge release."
how  = "Upgrade Forge, or regenerate the lock with the Forge version pinned for this project."
docs = "https://forge.dev/e/LCK-0002"

["FORGE-LCK-0003"]
what = "forge.lock is stale: its config_hash does not match the current resolved configuration."
why  = "forge.toml (or the selected variant) changed after the last lock refresh."
how  = "Run 'forge lock refresh' and commit the updated forge.lock."
docs = "https://forge.dev/e/LCK-0003"

["FORGE-LCK-0004"]
what = "forge.lock is missing from the project root."
why  = "A build requires a committed lockfile so dependency sets are pinned consciously."
how  = "Run 'forge update' to generate forge.lock, then commit it."
docs = "https://forge.dev/e/LCK-0004"

["FORGE-TSK-0001"]
what = "The task graph contains a dependency cycle."
why  = "Cycles make any execution order impossible, so nothing can run safely."
how  = "Remove or invert one edge in the reported cycle, then rebuild."
docs = "https://forge.dev/e/TSK-0001"

["FORGE-TSK-0002"]
what = "A task declares a dependency on a task name that does not exist."
why  = "Typos or deleted tasks leave dangling references in the graph."
how  = "Fix the dependsOn/softDependsOn reference to point at a declared task."
docs = "https://forge.dev/e/TSK-0002"

["FORGE-TSK-0003"]
what = "Two tasks share the same name in the graph."
why  = "Task names are unique identifiers used for dependencies and cache keys."
how  = "Rename one of the conflicting tasks."
docs = "https://forge.dev/e/TSK-0003"

["FORGE-CFG-0001"]
what = "No forge.toml was found in the project root."
why  = "Forge was run outside a project directory, or the configuration file was renamed or removed."
how  = "Run 'forge init' to create a project, or change to the directory that holds forge.toml."
docs = "https://forge.dev/e/CFG-0001"

["FORGE-CFG-0002"]
what = "The command line arguments were not understood."
why  = "An unknown command, subcommand, or flag was passed to the Forge CLI."
how  = "Run 'forge help' to see the available commands and their arguments."
docs = "https://forge.dev/e/CFG-0002"

["FORGE-DEP-0001"]
what = "Version conflict detected while resolving dependencies."
why  = "Two or more paths request different versions of the same artifact and no exact alignment exists; Forge fails by default instead of silently picking one."
how  = "Pin a version with [resolutions] in forge.toml, import a BOM that aligns the versions, or run 'forge resolve --explain' to see who requests what. Then run 'forge lock refresh'."
docs = "https://forge.dev/e/DEP-0001"

["FORGE-DEP-0002"]
what = "A dependency could not be resolved from any configured repository."
why  = "The coordinate or version is wrong, or every repository in [repositories] was unreachable."
how  = "Check the coordinate and version in forge.toml, verify the repository URLs are reachable, then retry."
docs = "https://forge.dev/e/DEP-0002"

["FORGE-RUN-0001"]
what = "The project does not declare a main class to run."
why  = "'forge run' needs an entry point, but [exec] main is empty in forge.toml."
how  = "Add [exec] main = \"com.example.Main\" to forge.toml."
docs = "https://forge.dev/e/RUN-0001"

["FORGE-RUN-0002"]
what = "The compiled classes needed to run the project were not found."
why  = "The project has not been built yet, or the build output directory is empty."
how  = "Run 'forge build' before 'forge run'."
docs = "https://forge.dev/e/RUN-0002"

["FORGE-CCH-0001"]
what = "A cached output archive failed integrity verification while being restored."
why  = "The local cache entry was corrupted on disk."
how  = "Run 'forge clean-cache' (or delete .forge/cache) to discard the damaged entry; the next build repopulates it."
docs = "https://forge.dev/e/CCH-0001"

["FORGE-CCH-0002"]
what = "The configured remote cache URL is invalid."
why  = "The remote cache URL set in [build] remote_cache or FORGE_REMOTE_CACHE is empty, malformed, or does not use http/https."
how  = "Fix the URL to a base like https://cache.example/forge, or remove it to build with a local-only cache."
docs = "https://forge.dev/e/CCH-0002"

["FORGE-RPR-0001"]
what = "A plugin produced outputs that differ between two identical builds."
why  = "Bit-for-bit reproducibility is guaranteed for core tasks only; plugins are best-effort (AGENT.md section 17)."
how  = "Report the behavior to the plugin author, or enable strict mode with [build] reproducible = 'strict' to fail instead of warn."
docs = "https://forge.dev/e/RPR-0001"

["FORGE-IMP-0001"]
what = "No build file to import was found in the current directory."
why  = "forge import reads pom.xml or build.gradle; neither exists here, so there is nothing to migrate (AGENT.md section 14)."
how  = "Run 'forge import' in a project that has a pom.xml or build.gradle, or pass one explicitly: 'forge import <file>'."
docs = "https://forge.dev/e/IMP-0001"

["FORGE-IMP-0002"]
what = "The build file to import is malformed and could not be parsed."
why  = "The pom.xml or build.gradle does not contain the structure Forge expects, so a reliable forge.toml cannot be produced."
how  = "Fix the reported XML/Gradle syntax error, or open an issue with the build file if it is valid for Maven/Gradle."
docs = "https://forge.dev/e/IMP-0002"

["FORGE-IMP-0003"]
what = "forge.toml already exists in the target directory."
why  = "Import never overwrites an existing configuration, because doing so would silently discard hand-written settings."
how  = "Move or delete the existing forge.toml, choose another directory with --output, or review the import first with --dry-run."
docs = "https://forge.dev/e/IMP-0003"

["FORGE-SCN-0001"]
what = "The build scan HTML report could not be written."
why  = "The output directory is not writable, or --scan-output points at a location Forge cannot create."
how  = "Choose a writable path with --scan-output=<path>, or fix the permissions of the target directory."
docs = "https://forge.dev/e/SCN-0001"

["FORGE-AUD-0001"]
what = "No dependencies were found to audit."
why  = "The resolved dependency graph is empty, so there is nothing to check against OSS Index."
how  = "Declare dependencies in [dependencies] in forge.toml, then run 'forge audit' again."
docs = "https://forge.dev/e/AUD-0001"

["FORGE-AUD-0003"]
what = "The configured OSS Index URL is invalid."
why  = "The URL set in [build] audit_oss_index or FORGE_OSS_INDEX is empty, malformed, or does not use http/https."
how  = "Fix the URL to a base like https://ossindex.sonatype.org, or remove it to use the default service."
docs = "https://forge.dev/e/AUD-0003"

["FORGE-AUD-0004"]
what = "OSS Index returned a document that could not be understood."
why  = "The service replied with a response that is not the expected JSON component report, or the response was corrupted."
how  = "Retry; if it persists, the service may have changed its API - report the issue with the response body."
docs = "https://forge.dev/e/AUD-0004"

["FORGE-NET-0001"]
what = "A remote service could not be reached."
why  = "The network is unavailable, the service is down, or the request failed after all retries."
how  = "Check your connectivity and the service URL, then retry; use 'forge audit --offline' to skip the vulnerability query entirely."
docs = "https://forge.dev/e/NET-0001"

["FORGE-INT-0001"]
what = "An unexpected internal error occurred."
why  = "This indicates a bug in Forge itself, not in your project."
how  = "Re-run with --debug to capture details and file an issue including the structured error block."
docs = "https://forge.dev/e/INT-0001"

["FORGE-VRT-0001"]
what = "The selected variant is not declared by any forge.toml in the project."
why  = "A variant must be declared as [variant.<name>] in the root or in at least one module; selection is explicit, never magic (AGENT.md section 8)."
how  = "Declare [variant.<name>] in forge.toml, or select one of the declared variants."
docs = "https://forge.dev/e/VRT-0001"

["FORGE-MMD-0001"]
what = "A module dependency cycle exists in the multi-module project."
why  = "Modules depend on each other in a loop, so no build order can exist (AGENT.md section 5)."
how  = "Break the cycle by removing one inter-module dependency, or move the shared code into a lower module."
docs = "https://forge.dev/e/MMD-0001"

["FORGE-MMD-0002"]
what = "A module declared in the root forge.toml has no forge.toml of its own."
why  = "Each module must own its configuration; the root only declares which directories are modules (AGENT.md section 5)."
how  = "Create <module-dir>/forge.toml, or fix the directory mapping in [project.modules] of the root forge.toml."
docs = "https://forge.dev/e/MMD-0002"

["FORGE-MMD-0003"]
what = "The requested module is not declared in the root forge.toml."
why  = "A partial build (forge build <module>) or 'forge config --show-resolved <module>' can only target modules listed under [project.modules]."
how  = "Check the module name, or add it to [project.modules] in the root forge.toml."
docs = "https://forge.dev/e/MMD-0003"

["FORGE-MMD-0004"]
what = "A multi-module project has no [project] group to build inter-module coordinates from."
why  = "Modules consume each other by Maven coordinate (groupId:artifactId:version), which needs a group (AGENT.md section 5)."
how  = "Set group = \"com.example\" under [project] in the root forge.toml."
docs = "https://forge.dev/e/MMD-0004"

["FORGE-PLG-0001"]
what = "A plugin targets a core API range that does not include the running Forge API version."
why  = "The plugin was built against an incompatible core API; loading it would risk undefined behavior, so it is never half-loaded."
how  = "Use a plugin version whose [plugin] api range includes this core, or upgrade Forge."
docs = "https://forge.dev/e/PLG-0001"

["FORGE-PLG-0002"]
what = "A forge-plugin.toml uses a descriptor schema version this Forge does not understand."
why  = "The plugin descriptor was written for a newer (or older, unsupported) schema than this core implements."
how  = "Upgrade Forge, or use a plugin built against the supported descriptor schema."
docs = "https://forge.dev/e/PLG-0002"

["FORGE-PLG-0003"]
what = "A forge-plugin.toml is malformed: a required field is missing or invalid."
why  = "The descriptor does not declare a required field (id, name, version, api, main) or a value has the wrong type."
how  = "Fix the reported field in forge-plugin.toml and rebuild the plugin."
docs = "https://forge.dev/e/PLG-0003"

["FORGE-PLG-0004"]
what = "Two loaded plugins declare the same plugin id."
why  = "Plugin ids are globally unique and stable; a duplicate makes identity ambiguous for cache keys and diagnostics."
how  = "Remove one of the conflicting plugins, or fix the duplicated id in its forge-plugin.toml."
docs = "https://forge.dev/e/PLG-0004"

["FORGE-PLG-0005"]
what = "A plugin's [[provides]] declaration disagrees with what it registers at runtime."
why  = "Drift between the declared descriptor and actual behavior is exactly the kind of surprise Forge exists to eliminate."
how  = "Update forge-plugin.toml to match the runtime registrations, or fix the plugin's registration code."
docs = "https://forge.dev/e/PLG-0005"

["FORGE-PLG-0006"]
what = "Two plugins register the same extension point."
why  = "Task types, compilers, test runners and packaging types are unique names; two owners make behavior ambiguous."
how  = "Rename one extension point, or remove one of the plugins that registers it."
docs = "https://forge.dev/e/PLG-0006"

["FORGE-PLG-0007"]
what = "A plugin tried to replace a built-in task type."
why  = "Plugins may add new types but never shadow built-ins (AGENT.md section 4)."
how  = "Rename the plugin task type; built-ins are reserved."
docs = "https://forge.dev/e/PLG-0007"

["FORGE-PLG-0008"]
what = "A plugin dependency declared in forge-plugin.toml could not be resolved."
why  = "The coordinate or version is wrong, or every configured repository was unreachable."
how  = "Check the [dependencies] entries in forge-plugin.toml and the [repositories] in forge.toml, then retry."
docs = "https://forge.dev/e/PLG-0008"

["FORGE-PLG-0009"]
what = "A plugin's declared entry point could not be loaded."
why  = "The [plugin] main class named in forge-plugin.toml is missing, does not implement ForgePlugin, or failed to instantiate."
how  = "Fix the 'plugin.main' class in forge-plugin.toml so it implements io.github.yasmramos.forge.plugin.ForgePlugin, then rebuild the plugin."
docs = "https://forge.dev/e/PLG-0009"

["FORGE-PLG-0010"]
what = "A plugin-contributed task is invalid: it has no name, duplicates another task, or would shadow a built-in task."
why  = "Task names are unique in the graph; a plugin must not collide with a built-in task (compile, test, package, javaExec, clean, resolve) or with another plugin task."
how  = "Rename the offending plugin task in its factory, or remove the duplicate contribution."
docs = "https://forge.dev/e/PLG-0010"

["FORGE-PLG-0011"]
what = "The source directory for a plugin compiler's language could not be scanned."
why  = "The configured source directory is unreadable or disappeared while the build was gathering sources for a plugin-registered language."
how  = "Check the source directory permissions and that it exists, then rebuild."
docs = "https://forge.dev/e/PLG-0011"

["FORGE-PLG-0012"]
what = "The test directory for a plugin test runner's language could not be scanned."
why  = "A test source directory is unreadable or disappeared while the build was gathering tests for a plugin-registered runner."
how  = "Check the test directory permissions and that it exists, then rebuild."
docs = "https://forge.dev/e/PLG-0012"

["FORGE-PLG-0013"]
what = "The packaging type selected in [project] is not provided by any loaded plugin."
why  = "A project selects a packaging type through 'packaging' in [project]; Forge found no loaded plugin that registered an implementation for it, so it cannot produce that artifact."
how  = "Declare the plugin providing the type in [plugins] of forge.toml, fix the type name, or set packaging = \"jar\" for the built-in packaging."
docs = "https://forge.dev/e/PLG-0013"

["FORGE-PUB-0001"]
what = "The project is missing metadata Maven Central requires for publishing."
why  = "Maven Central rejects artifacts without a license, developer, project URL and SCM section (AGENT.md section 6)."
how  = "Add the missing keys under [publish] in forge.toml (license, license_url, developers, developer_names, url, scm), then retry."
docs = "https://forge.dev/e/PUB-0001"

["FORGE-PUB-0002"]
what = "The project coordinates required to publish are incomplete."
why  = "Publishing needs a groupId, artifactId and version, taken from [project] group, name and version."
how  = "Set group, name and version under [project] in forge.toml, then retry."
docs = "https://forge.dev/e/PUB-0002"

["FORGE-PUB-0003"]
what = "Forge could not write the staged publish artifacts to disk."
why  = "The staging directory is not writable, or the disk is full."
how  = "Check write permissions on the staging directory (default target/forge-publish) and free disk space, then retry."
docs = "https://forge.dev/e/PUB-0003"

["FORGE-PUB-0004"]
what = "The main artifact to publish was not found."
why  = "forge publish stages the packaged JAR, but no build output exists under target/forge-output."
how  = "Run 'forge build' before 'forge publish'."
docs = "https://forge.dev/e/PUB-0004"

["FORGE-PUB-0005"]
what = "The target repository for publishing is not declared in [repositories]."
why  = "forge publish uploads to a repository key from [publish] repository, which must resolve against [repositories] in forge.toml."
how  = "Declare the repository URL under [repositories] in forge.toml, or point [publish] repository at an existing key."
docs = "https://forge.dev/e/PUB-0005"

["FORGE-PUB-0006"]
what = "An artifact could not be uploaded to the target repository."
why  = "The repository rejected the upload (HTTP status in the message), or the network failed. A partial publish is not a success."
how  = "Check the repository URL and credentials in ~/.forge/credentials.toml, verify network access, then retry; re-uploading is idempotent."
docs = "https://forge.dev/e/PUB-0006"

["FORGE-PUB-0007"]
what = "The credentials file ~/.forge/credentials.toml could not be read."
why  = "The file exists but is not valid TOML, or a repository entry is missing username/password."
how  = "Fix the TOML in ~/.forge/credentials.toml; each repository needs username and password keys."
docs = "https://forge.dev/e/PUB-0007"
