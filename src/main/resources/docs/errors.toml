# Forge error catalog (AGENT.md section 10bis).
# Codes are stable public API: never reused, never renumbered.
# This file is validated against cli/error/ErrorCode.java by ErrorCatalogTest.

["FORGE-LCK-0001"]
what = "The content hash at the end of forge.lock does not match the file body."
why  = "The lockfile was edited by hand, truncated, or corrupted during transfer."
how  = "Delete forge.lock and run 'forge lock refresh' to regenerate it deterministically."
docs = "https://forge.dev/e/LCK-0001"

["FORGE-LCK-0002"]
what = "forge.lock uses a newer schema version than this Forge installation understands."
why  = "The lockfile was generated by a future Forge release."
how  = "Upgrade Forge, or regenerate the lock with the Forge version pinned for this project."
docs = "https://forge.dev/e/LCK-0002"

["FORGE-LCK-0003"]
what = "forge.lock is stale: its config_hash does not match the current resolved configuration."
why  = "forge.toml (or the selected variant) changed after the last lock refresh."
how  = "Run 'forge lock refresh' and commit the updated forge.lock."
docs = "https://forge.dev/e/LCK-0003"

["FORGE-LCK-0004"]
what = "forge.lock is missing from the project root."
why  = "A build requires a committed lockfile so dependency sets are pinned consciously."
how  = "Run 'forge update' to generate forge.lock, then commit it."
docs = "https://forge.dev/e/LCK-0004"

["FORGE-TSK-0001"]
what = "The task graph contains a dependency cycle."
why  = "Cycles make any execution order impossible, so nothing can run safely."
how  = "Remove or invert one edge in the reported cycle, then rebuild."
docs = "https://forge.dev/e/TSK-0001"

["FORGE-TSK-0002"]
what = "A task declares a dependency on a task name that does not exist."
why  = "Typos or deleted tasks leave dangling references in the graph."
how  = "Fix the dependsOn/softDependsOn reference to point at a declared task."
docs = "https://forge.dev/e/TSK-0002"

["FORGE-TSK-0003"]
what = "Two tasks share the same name in the graph."
why  = "Task names are unique identifiers used for dependencies and cache keys."
how  = "Rename one of the conflicting tasks."
docs = "https://forge.dev/e/TSK-0003"

["FORGE-CCH-0001"]
what = "A cached output archive failed integrity verification while being restored."
why  = "The local cache entry was corrupted on disk."
how  = "Run 'forge clean-cache' (or delete .forge/cache) to discard the damaged entry; the next build repopulates it."
docs = "https://forge.dev/e/CCH-0001"

["FORGE-RPR-0001"]
what = "A plugin produced outputs that differ between two identical builds."
why  = "Bit-for-bit reproducibility is guaranteed for core tasks only; plugins are best-effort (AGENT.md section 17)."
how  = "Report the behavior to the plugin author, or enable strict mode with [build] reproducible_strict = true to fail instead of warn."
docs = "https://forge.dev/e/RPR-0001"

["FORGE-INT-0001"]
what = "An unexpected internal error occurred."
why  = "This indicates a bug in Forge itself, not in your project."
how  = "Re-run with --debug to capture details and file an issue including the structured error block."
docs = "https://forge.dev/e/INT-0001"
