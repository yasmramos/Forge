# Library example: validates dependency resolution, scopes and tests.
#
# NOTE: A committed forge.lock will accompany this example once lockfiles
# are enabled by default (planned for 0.2). Until then, versions above are
# pinned directly in this file.

forge = "0.1"

[project]
name    = "library"
version = "1.0.0"
group   = "com.example"

[project.properties]
"slf4j.version" = "2.0.7"
"junit.version" = "5.9.2"

[repositories]
central = "https://repo1.maven.org/maven2"

[toolchain]
language = "11"

[source.main]
java = ["src/main/java"]

[source.test]
java = ["src/test/java"]

[dependencies.compile]
"org.slf4j:slf4j-api" = "${slf4j.version}"

[dependencies.runtime]
"org.slf4j:slf4j-simple" = "${slf4j.version}"

[dependencies.test]
"org.junit.jupiter:junit-jupiter" = "${junit.version}"

[build]
incremental   = true
cache_enabled = true

[exec]
main = "com.example.lib.Main"
